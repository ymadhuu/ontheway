<!DOCTYPE html>
<html>
<head>
    <title>Admin - Manage Trains</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            /* Vahi premium background jo Search page par hai */
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), 
                        url('https://images.unsplash.com/photo-1474487056217-76fe7500d236?q=80&w=2000&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .admin-box { 
            background: rgba(255, 255, 255, 0.1); 
            padding: 30px; 
            border-radius: 20px; 
            border: 1px solid rgba(0, 210, 255, 0.3); 
            backdrop-filter: blur(15px);
            width: 100%;
            max-width: 450px;
        }
        h2 { color: #00d2ff; text-align: center; margin-bottom: 5px; }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; 
            border: none; outline: none; box-sizing: border-box;
            background: rgba(255,255,255,0.9);
        }
        .add-btn { 
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%); 
            color: white; font-weight: bold; border: none; padding: 14px; 
            width: 100%; cursor: pointer; border-radius: 8px; margin-top: 10px;
            text-transform: uppercase;
        }
        .add-btn:hover { transform: scale(1.02); }
        #msg { font-weight: bold; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>🚆 Admin Control</h2>
        <p style="text-align: center; color: #ccc; margin-bottom: 20px;">System mein nayi train add karein</p>
        
        <input type="text" id="trainName" placeholder="Train Name (e.g. Bangalore Express)">
        <input type="text" id="trainNumber" placeholder="Train Number (e.g. 12627)">
        <input type="text" id="source" placeholder="From (Source)">
        <input type="text" id="destination" placeholder="To (Destination)">
        <input type="text" id="departure" placeholder="Departure Time (e.g. 08:00 PM)">
        <input type="number" id="fare" placeholder="Ticket Price (₹)">
        
        <button class="add-btn" onclick="addTrain()">➕ ADD TRAIN TO SYSTEM</button>
        
        <p id="msg"></p>
        <a href="/dashboard" style="display: block; text-align: center; color: #00d2ff; text-decoration: none; margin-top: 15px; font-size: 0.9rem;">← Back to Dashboard</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>

    <script>
        // --- Security Check ---
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // Apna email yahan check karein
                if (user.email !== "admin@otw.com") { 
                    alert("Aap admin nahi hain! Redirecting...");
                    window.location.href = "/dashboard";
                }
            } else {
                window.location.href = "/login";
            }
        });

        async function addTrain() {
            const db = firebase.firestore();
            const msg = document.getElementById('msg');
            
            // Getting values
            const name = document.getElementById('trainName').value;
            const train_no = document.getElementById('trainNumber').value;
            const source = document.getElementById('source').value.toLowerCase().trim();
            const destination = document.getElementById('destination').value.toLowerCase().trim();
            const departure = document.getElementById('departure').value;
            const fare = document.getElementById('fare').value;

            // Simple Validation
            if(!name || !source || !destination || !fare) {
                msg.style.color = "#ffcc00";
                msg.innerText = "⚠️ Saare fields bhariye!";
                return;
            }

            const trainData = {
                name: name,
                train_no: train_no,
                source: source,      // Matches search page
                destination: destination, // Matches search page
                departure: departure,
                fare: parseInt(fare),
                seatsAvailable: 60
            };

            try {
                msg.innerText = "⏳ Adding to database...";
                await db.collection("trains").add(trainData);
                msg.style.color = "#00ff88";
                msg.innerText = "✅ Train Successfully Added!";
                
                // Form clear
                document.querySelectorAll('input').forEach(i => i.value = "");
            } catch (e) {
                msg.style.color = "#ff4b2b";
                msg.innerText = "❌ Error: " + e.message;
            }
        }
    </script>
</body>
</html>
