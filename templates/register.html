<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OTW Rail - Access Portal</title>
    <style>
        /* --- 1. Welcome Overlay Styles --- */
        #welcome-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #050505;
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-in-out, visibility 1s;
        }

        .welcome-content { text-align: center; }

        .train-icon {
            font-size: 50px;
            animation: drive 2s infinite ease-in-out;
            display: inline-block;
        }

        .welcome-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: #00ff88; /* Register page ke liye thoda greenish touch */
            letter-spacing: 8px;
            margin-top: 15px;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
            font-family: 'Segoe UI', sans-serif;
        }

        .load-bar {
            width: 250px; height: 3px;
            background: rgba(255,255,255,0.1);
            margin: 25px auto; border-radius: 10px; overflow: hidden;
        }

        .load-progress {
            width: 0%; height: 100%;
            background: linear-gradient(to right, #00ff88, #00d2ff);
            box-shadow: 0 0 10px #00ff88;
            animation: fillProgress 2.5s forwards;
        }

        @keyframes drive {
            0% { transform: translateX(-30px); opacity: 0; }
            50% { transform: translateX(0px); opacity: 1; }
            100% { transform: translateX(30px); opacity: 0; }
        }

        @keyframes fillProgress { to { width: 100%; } }

        .fade-out { opacity: 0; visibility: hidden; }

        /* --- 2. Registration Card Styles --- */
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url("{{ url_for('static', filename='images/loginpage.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;
            overflow: hidden;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(25px);
            padding: 35px; border-radius: 25px; width: 380px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            animation: cardPopup 1s ease-out 2.8s both;
        }

        @keyframes cardPopup {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tab System */
        .tab-box {
            display: flex; background: rgba(0,0,0,0.4); border-radius: 15px;
            margin-bottom: 25px; padding: 5px; border: 1px solid rgba(255,255,255,0.05);
        }
        .tab {
            flex: 1; padding: 12px; cursor: pointer; border-radius: 10px;
            font-size: 0.85rem; transition: 0.3s; font-weight: bold; color: #888;
        }
        .tab.active-user { background: #00ff88; color: #000; }
        .tab.active-admin { background: #ff4b2b; color: #fff; }

        input {
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.3);
            color: white; outline: none; box-sizing: border-box; text-align: center;
            transition: 0.3s;
        }
        input:focus { border-color: #00d2ff; background: rgba(0,0,0,0.5); }

        .btn {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 1rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-user { background: #00ff88; color: #000; }
        .btn-admin { background: #ff4b2b; color: #fff; display: none; }
        
        .btn:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div id="welcome-overlay">
        <div class="welcome-content">
            <div class="train-icon">🚄</div>
            <div class="welcome-text">ON THE WAY</div>
            <div class="load-bar">
                <div class="load-progress"></div>
            </div>
        </div>
    </div>

    <div class="auth-card">
        <div class="tab-box">
            <div id="uTab" class="tab active-user" onclick="toggleForm('user')">REGISTER</div>
            <div id="aTab" class="tab" onclick="toggleForm('admin')">ADMIN LOGIN</div>
        </div>

        <h2 id="title" style="color: #00ff88; margin-bottom: 25px; text-transform: uppercase;">Create User Account</h2>

        <div id="input-container">
            <input type="text" id="regName" placeholder="Enter Full Name">
            <input type="email" id="regEmail" placeholder="Email Address">
            <input type="password" id="regPass" placeholder="Security Password">
        </div>

        <button class="btn btn-user" id="uBtn" onclick="handleSignUp()">Join OTW Rail</button>
        <button class="btn btn-admin" id="aBtn" onclick="adminAuth()">Access Database</button>

        <p id="footer" style="margin-top: 20px; font-size: 0.85rem;">
            <a href="/" style="color: #00d2ff; text-decoration: none; font-weight: bold;">← Back to Login</a>
        </p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>

    <script>
        // 1. Overlay Control
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('welcome-overlay').classList.add('fade-out');
                document.body.style.overflow = "auto";
            }, 3000);
        });

        // 2. Form Toggle Logic
        function toggleForm(mode) {
            const uTab = document.getElementById('uTab'), aTab = document.getElementById('aTab');
            const title = document.getElementById('title'), nameInp = document.getElementById('regName');
            const uBtn = document.getElementById('uBtn'), aBtn = document.getElementById('aBtn');

            if(mode === 'admin') {
                uTab.classList.remove('active-user'); aTab.classList.add('active-admin');
                title.innerText = "Admin Database Login"; title.style.color = "#ff4b2b";
                nameInp.style.display = "none"; uBtn.style.display = "none"; aBtn.style.display = "block";
            } else {
                aTab.classList.remove('active-admin'); uTab.classList.add('active-user');
                title.innerText = "Create User Account"; title.style.color = "#00ff88";
                nameInp.style.display = "block"; uBtn.style.display = "block"; aBtn.style.display = "none";
            }
        }

        function handleSignUp() {
            if (typeof signUp === "function") signUp();
            else alert("Error: auth.js correctly load nahi hua!");
        }

        function adminAuth() {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            if(!email || !pass) return alert("Email and Password are required!");

            firebase.auth().signInWithEmailAndPassword(email, pass)
            .then((userCredential) => {
                if(userCredential.user.email === "admin@otw.com") {
                    window.location.href = "/admin"; 
                } else {
                    alert("Unauthorized Access!");
                    firebase.auth().signOut();
                }
            }).catch(err => alert("Login Error: " + err.message));
        }
    </script>
</body>
</html>
